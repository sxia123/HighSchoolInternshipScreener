name: Scheduled Internship Scan

on:
  schedule:
    # Runs twice daily at 01:00 and 13:00 UTC
    - cron: "0 1,13 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run internship scanner and high school screener
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python scanner.py --trigger github_actions

      - name: Upload local SQLite snapshot (when Turso secrets are not configured)
        if: ${{ env.TURSO_DATABASE_URL == '' && hashFiles('backend/data/internships.db') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: internships-sqlite-db
          path: backend/data/internships.db
          retention-days: 7
